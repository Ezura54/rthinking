<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>精神科药物知识图谱</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2b;
      --line: #243653;
      --text: #dbe7ff;
      --muted: #96abd0;
      --chip: #0f182a;
      --chip-on: #1c2c4a;
      --accent: #5e88ff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; }
    body {
      font-family: "Inter", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }
    .app {
      display: grid;
      grid-template-columns: 348px 1fr;
      width: 100%;
      height: 100%;
    }
    .sidebar {
      border-right: 1px solid var(--line);
      background: var(--panel);
      padding: 12px;
      overflow: auto;
    }
    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 2px 0 4px;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .group {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }
    .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }
    .input {
      width: 100%;
      border: 1px solid #344c72;
      border-radius: 8px;
      background: #0a1426;
      color: var(--text);
      padding: 8px 10px;
      outline: none;
    }
    .input:focus { border-color: var(--accent); }
    .range-wrap {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .range-wrap input[type="range"] { width: 100%; }
    .range-val { color: #c2d4f6; font-size: 12px; min-width: 12px; text-align: right; }
    .chip-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip {
      border: 1px solid #37517c;
      border-radius: 999px;
      background: var(--chip);
      color: #cfe0ff;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .chip.on {
      background: var(--chip-on);
      color: #e7f0ff;
    }
    .row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 8px;
    }
    .btn {
      border: 1px solid #37517c;
      border-radius: 8px;
      background: #10203b;
      color: #dce8ff;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:hover { background: #17345f; }
    .check {
      font-size: 12px;
      color: #c8d9f7;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .details {
      margin-top: 12px;
      border-top: 1px solid var(--line);
      padding-top: 10px;
      font-size: 12px;
      line-height: 1.6;
      word-break: break-word;
    }
    .d-title {
      font-size: 15px;
      font-weight: 700;
      color: #edf4ff;
      margin-bottom: 2px;
    }
    .d-sub {
      color: #a3b8de;
      margin-bottom: 8px;
    }
    .kv { margin: 4px 0; }
    .k { color: var(--muted); margin-right: 6px; }
    .rel-list {
      margin-top: 8px;
      display: grid;
      gap: 6px;
    }
    .rel-item {
      border: 1px solid #304665;
      border-radius: 8px;
      background: #0f1a2d;
      padding: 6px 8px;
      cursor: pointer;
    }
    .rel-item:hover { border-color: #5f89cf; }
    .rel-head { color: #d8e8ff; margin-bottom: 3px; }
    .rel-meta { color: #9db3d7; font-size: 11px; }
    .canvas {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #graph {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 10;
      border: 1px solid #2b4368;
      border-radius: 8px;
      background: rgba(11, 20, 36, 0.82);
      color: #c9dcff;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
      backdrop-filter: blur(6px);
    }
    .tooltip {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      border: 1px solid #3a5480;
      border-radius: 8px;
      background: rgba(15, 24, 41, 0.95);
      color: #eaf2ff;
      max-width: 380px;
      padding: 8px 10px;
      font-size: 12px;
      line-height: 1.5;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 120ms ease, transform 120ms ease;
    }
    .tooltip.show {
      opacity: 1;
      transform: translateY(0);
    }
    @media (max-width: 1100px) {
      .app { grid-template-columns: 320px 1fr; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="title">精神科药物知识图谱</div>
      <div id="meta" class="meta">加载中...</div>

      <div class="group">
        <div class="label">搜索</div>
        <input id="search" class="input" placeholder="药物 / 靶点 / 疾病 / 基因" />
      </div>

      <div class="group">
        <div class="label">邻域跳数（搜索/选中生效）</div>
        <div class="range-wrap">
          <input id="hops" type="range" min="1" max="3" value="2" />
          <span id="hops-val" class="range-val">2</span>
        </div>
      </div>

      <div class="group">
        <div class="label">节点类型</div>
        <div id="type-chips" class="chip-grid"></div>
      </div>

      <div class="group">
        <div class="label">关系类型</div>
        <div id="rel-chips" class="chip-grid"></div>
      </div>

      <div class="group">
        <div class="row">
          <label class="check">
            <input id="show-labels" type="checkbox" checked />
            显示标签（药物 + 选中邻居）
          </label>
        </div>
        <div class="row">
          <button id="reset-btn" class="btn">重置视图</button>
        </div>
      </div>

      <div id="details" class="details">点击节点查看详情。</div>
    </aside>

    <main class="canvas">
      <svg id="graph"></svg>
      <div id="hud" class="hud">Nodes: 0<br />Edges: 0</div>
    </main>
  </div>

  <div id="tooltip" class="tooltip"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script>
    const NODE_COLOR_MAP = {
      "药物": "#6ea1ff",
      "疾病/适应症": "#f5c56a",
      "受体/靶点": "#f48fc5",
      "代谢酶": "#63d7b7",
      "基因": "#ffa06c",
      "特殊人群": "#78ceff"
    };

    const REL_COLOR_MAP = {
      "代谢_经由": "#63d7b7",
      "治疗": "#f5c56a",
      "基因关联": "#ffa06c",
      "特殊人群_注意": "#78ceff"
    };

    const state = {
      raw: null,
      activeTypes: new Set(),
      activeRelations: new Set(),
      selectedNodeId: null,
      query: "",
      hops: 2,
      showLabels: true,
      visibleNodes: [],
      visibleEdges: [],
      visibleNodeMap: new Map()
    };

    const metaEl = document.getElementById("meta");
    const hudEl = document.getElementById("hud");
    const detailsEl = document.getElementById("details");
    const typeChipsEl = document.getElementById("type-chips");
    const relChipsEl = document.getElementById("rel-chips");
    const searchEl = document.getElementById("search");
    const hopsEl = document.getElementById("hops");
    const hopsValEl = document.getElementById("hops-val");
    const showLabelsEl = document.getElementById("show-labels");
    const resetBtn = document.getElementById("reset-btn");
    const tooltipEl = document.getElementById("tooltip");

    const svg = d3.select("#graph");
    const root = svg.append("g");
    const linkLayer = root.append("g");
    const nodeLayer = root.append("g");
    const labelLayer = root.append("g");

    const zoom = d3.zoom().scaleExtent([0.2, 5]).on("zoom", (event) => {
      root.attr("transform", event.transform);
    });
    svg.call(zoom);

    let simulation = null;

    function safeText(value) {
      return String(value == null ? "" : value).trim();
    }

    function escapeHtml(value) {
      return safeText(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function shortText(value, n = 160) {
      const text = safeText(value);
      if (!text) return "";
      return text.length > n ? text.slice(0, n - 3).trim() + "..." : text;
    }

    function hashHue(text) {
      let hash = 0;
      for (let i = 0; i < text.length; i += 1) {
        hash = (hash * 31 + text.charCodeAt(i)) >>> 0;
      }
      return hash % 360;
    }

    function colorByHash(text, sat = 55, light = 58) {
      return `hsl(${hashHue(text)}, ${sat}%, ${light}%)`;
    }

    function nodeColor(type) {
      return NODE_COLOR_MAP[type] || colorByHash(type || "unknown", 52, 63);
    }

    function relationColor(relation) {
      if (REL_COLOR_MAP[relation]) return REL_COLOR_MAP[relation];
      if (safeText(relation).startsWith("结合_")) return "#9f8af7";
      return colorByHash(relation || "unknown", 45, 56);
    }

    function normalizeRef(value) {
      if (typeof value === "string") return value;
      if (value && typeof value === "object") return safeText(value.id || value.name || "");
      return safeText(value);
    }

    function normalizeGraph(raw) {
      const nodes = [];
      const nodeSeen = new Set();
      (raw.nodes || []).forEach((node) => {
        const id = safeText(node.id);
        const type = safeText(node.type);
        if (!id || !type || nodeSeen.has(id)) return;
        nodeSeen.add(id);
        nodes.push({ ...node, id, type });
      });

      const edges = [];
      const edgeSeen = new Set();
      (raw.edges || []).forEach((edge) => {
        const source = normalizeRef(edge.source);
        const target = normalizeRef(edge.target);
        const relation = safeText(edge.relation);
        if (!source || !target || !relation || source === target) return;
        const safeEdge = { ...edge, source, target, relation };
        const key = JSON.stringify(safeEdge);
        if (edgeSeen.has(key)) return;
        edgeSeen.add(key);
        edges.push(safeEdge);
      });
      return { nodes, edges };
    }

    function buildAdjacency(edges) {
      const adj = new Map();
      edges.forEach((edge) => {
        if (!adj.has(edge.source)) adj.set(edge.source, new Set());
        if (!adj.has(edge.target)) adj.set(edge.target, new Set());
        adj.get(edge.source).add(edge.target);
        adj.get(edge.target).add(edge.source);
      });
      return adj;
    }

    function bfsKeepIds(seeds, adjacency, hops) {
      const keep = new Set(seeds);
      let frontier = new Set(seeds);
      for (let i = 0; i < hops; i += 1) {
        const next = new Set();
        frontier.forEach((id) => {
          const neighbors = adjacency.get(id);
          if (!neighbors) return;
          neighbors.forEach((nid) => {
            if (!keep.has(nid)) next.add(nid);
          });
        });
        if (next.size === 0) break;
        next.forEach((nid) => keep.add(nid));
        frontier = next;
      }
      return keep;
    }

    function nodeMatches(node, queryLower) {
      const blob = [
        node.id, node.type, node.category, node.name_en, node.half_life,
        node.tmax, node.tdm_range, node.tdm_alert, node.bbw
      ].map(safeText).join(" ").toLowerCase();
      return blob.includes(queryLower);
    }

    function computeVisible() {
      const allNodes = state.raw.nodes.filter((n) => state.activeTypes.has(n.type));
      const nodeIds = new Set(allNodes.map((n) => n.id));
      const allEdges = state.raw.edges.filter((e) =>
        state.activeRelations.has(e.relation) &&
        nodeIds.has(e.source) &&
        nodeIds.has(e.target)
      );

      const queryLower = state.query.trim().toLowerCase();
      let seeds = [];
      if (state.selectedNodeId && nodeIds.has(state.selectedNodeId)) {
        seeds = [state.selectedNodeId];
      } else if (queryLower) {
        seeds = allNodes.filter((n) => nodeMatches(n, queryLower)).map((n) => n.id);
      }

      let keepIds = nodeIds;
      if (queryLower || seeds.length > 0) {
        if (seeds.length === 0) {
          keepIds = new Set();
        } else {
          keepIds = bfsKeepIds(seeds, buildAdjacency(allEdges), state.hops);
        }
      }

      const nodes = allNodes.filter((n) => keepIds.has(n.id));
      const keepNodeIds = new Set(nodes.map((n) => n.id));
      const edges = allEdges.filter((e) => keepNodeIds.has(e.source) && keepNodeIds.has(e.target));
      return { nodes, edges };
    }

    function buildChips(container, entries, activeSet, colorFn, onChange) {
      container.innerHTML = "";
      entries.forEach((entry) => {
        const chip = document.createElement("button");
        chip.className = "chip on";
        chip.style.borderColor = colorFn(entry.key);
        chip.textContent = `${entry.key} (${entry.count})`;
        chip.addEventListener("click", () => {
          if (activeSet.has(entry.key)) {
            activeSet.delete(entry.key);
            chip.classList.remove("on");
          } else {
            activeSet.add(entry.key);
            chip.classList.add("on");
          }
          onChange();
        });
        container.appendChild(chip);
      });
    }

    function showTooltip(html, x, y) {
      tooltipEl.innerHTML = html;
      tooltipEl.style.left = `${x + 12}px`;
      tooltipEl.style.top = `${y + 12}px`;
      tooltipEl.classList.add("show");
    }

    function hideTooltip() {
      tooltipEl.classList.remove("show");
    }

    function renderDetails(node) {
      if (!node) {
        detailsEl.textContent = "点击节点查看详情。";
        return;
      }

      const edges = state.visibleEdges.filter((e) => e.source === node.id || e.target === node.id);
      const rows = [];
      rows.push(`<div class="d-title">${escapeHtml(node.id)}</div>`);
      rows.push(`<div class="d-sub">${escapeHtml(node.type)}${node.category ? " · " + escapeHtml(node.category) : ""}</div>`);
      if (node.name_en) rows.push(`<div class="kv"><span class="k">EN</span>${escapeHtml(node.name_en)}</div>`);
      if (node.half_life) rows.push(`<div class="kv"><span class="k">Half-life</span>${escapeHtml(node.half_life)}</div>`);
      if (node.tmax) rows.push(`<div class="kv"><span class="k">Tmax</span>${escapeHtml(node.tmax)}</div>`);
      if (node.tdm_range) rows.push(`<div class="kv"><span class="k">TDM range</span>${escapeHtml(node.tdm_range)}</div>`);
      if (node.tdm_alert) rows.push(`<div class="kv"><span class="k">TDM alert</span>${escapeHtml(node.tdm_alert)}</div>`);
      if (node.bbw) rows.push(`<div class="kv"><span class="k">BBW</span>${escapeHtml(node.bbw)}</div>`);
      rows.push(`<div class="kv"><span class="k">可见关系数</span>${edges.length}</div>`);

      const relHtml = edges.slice(0, 36).map((edge) => {
        const other = edge.source === node.id ? edge.target : edge.source;
        const relation = escapeHtml(edge.relation);
        const ki = edge.ki !== undefined ? `Ki=${escapeHtml(edge.ki)}` : "";
        const ap = edge.nmpa !== undefined || edge.fda !== undefined
          ? `NMPA=${escapeHtml(edge.nmpa)} FDA=${escapeHtml(edge.fda)}`
          : "";
        const detail = edge.detail ? `<div class="rel-meta">${escapeHtml(shortText(edge.detail, 220))}</div>` : "";
        const meta = [ki, ap].filter(Boolean).join(" | ");
        return `<div class="rel-item" data-target="${escapeHtml(other)}">
          <div class="rel-head">${escapeHtml(node.id)} → [${relation}] → ${escapeHtml(other)}</div>
          ${meta ? `<div class="rel-meta">${meta}</div>` : ""}
          ${detail}
        </div>`;
      }).join("");

      rows.push(`<div class="rel-list">${relHtml || "<div class='rel-meta'>当前筛选下无关系。</div>"}</div>`);
      detailsEl.innerHTML = rows.join("");

      detailsEl.querySelectorAll(".rel-item").forEach((el) => {
        el.addEventListener("click", () => {
          const targetId = safeText(el.getAttribute("data-target"));
          if (!targetId || !state.visibleNodeMap.has(targetId)) return;
          state.selectedNodeId = targetId;
          updateGraph();
        });
      });
    }

    function linkId(link) {
      const source = typeof link.source === "object" ? link.source.id : link.source;
      const target = typeof link.target === "object" ? link.target.id : link.target;
      return `${source}|${target}|${link.relation}`;
    }

    function applyHighlight() {
      const selected = state.selectedNodeId;
      const hitEdgeIds = new Set();
      if (selected) {
        state.visibleEdges.forEach((e) => {
          if (e.source === selected || e.target === selected) {
            hitEdgeIds.add(`${e.source}|${e.target}|${e.relation}`);
          }
        });
      }

      linkLayer.selectAll("line")
        .attr("stroke-opacity", (d) => !selected ? 0.36 : (hitEdgeIds.has(linkId(d)) ? 0.9 : 0.08))
        .attr("stroke-width", (d) => !selected ? 1.1 : (hitEdgeIds.has(linkId(d)) ? 2 : 1));

      nodeLayer.selectAll("circle")
        .attr("opacity", (d) => {
          if (!selected) return 1;
          if (d.id === selected) return 1;
          const linked = state.visibleEdges.some((e) =>
            (e.source === selected && e.target === d.id) ||
            (e.target === selected && e.source === d.id)
          );
          return linked ? 1 : 0.2;
        })
        .attr("stroke-width", (d) => d.id === selected ? 2.2 : 1);
    }

    function updateGraph() {
      const { nodes, edges } = computeVisible();
      state.visibleNodes = nodes;
      state.visibleEdges = edges;
      state.visibleNodeMap = new Map(nodes.map((n) => [n.id, n]));

      if (state.selectedNodeId && !state.visibleNodeMap.has(state.selectedNodeId)) {
        state.selectedNodeId = null;
      }
      renderDetails(state.selectedNodeId ? state.visibleNodeMap.get(state.selectedNodeId) : null);
      hudEl.innerHTML = `Nodes: ${nodes.length}<br>Edges: ${edges.length}`;

      const nodeData = nodes.map((n) => ({ ...n }));
      const linkData = edges.map((e) => ({ ...e }));

      const links = linkLayer.selectAll("line").data(linkData, (d) => `${d.source}|${d.target}|${d.relation}`);
      links.exit().remove();
      const linksEnter = links.enter()
        .append("line")
        .attr("stroke-width", 1.1)
        .on("mousemove", (event, d) => {
          const extra = [];
          if (d.ki !== undefined) extra.push(`Ki=${escapeHtml(d.ki)}`);
          if (d.nmpa !== undefined || d.fda !== undefined) {
            extra.push(`NMPA=${escapeHtml(d.nmpa)} FDA=${escapeHtml(d.fda)}`);
          }
          const detail = d.detail ? `<div>${escapeHtml(shortText(d.detail, 220))}</div>` : "";
          showTooltip(
            `<div><b>${escapeHtml(d.relation)}</b></div>
             <div>${escapeHtml(d.source)} → ${escapeHtml(d.target)}</div>
             ${extra.length ? `<div>${extra.join(" | ")}</div>` : ""}
             ${detail}`,
            event.clientX,
            event.clientY
          );
        })
        .on("mouseleave", hideTooltip);
      const linksMerge = linksEnter.merge(links)
        .attr("stroke", (d) => relationColor(d.relation));

      const nodesSel = nodeLayer.selectAll("circle").data(nodeData, (d) => d.id);
      nodesSel.exit().remove();
      const nodesEnter = nodesSel.enter()
        .append("circle")
        .attr("r", (d) => d.type === "药物" ? 6.5 : 4.8)
        .attr("fill", (d) => nodeColor(d.type))
        .attr("stroke", "#0b1425")
        .attr("stroke-width", 1)
        .on("click", (event, d) => {
          event.stopPropagation();
          state.selectedNodeId = d.id;
          updateGraph();
        })
        .on("mousemove", (event, d) => {
          showTooltip(
            `<div><b>${escapeHtml(d.id)}</b></div>
             <div>${escapeHtml(d.type)}${d.category ? " · " + escapeHtml(d.category) : ""}</div>
             ${d.name_en ? `<div>${escapeHtml(d.name_en)}</div>` : ""}`,
            event.clientX,
            event.clientY
          );
        })
        .on("mouseleave", hideTooltip)
        .call(
          d3.drag()
            .on("start", (event, d) => {
              if (!event.active && simulation) simulation.alphaTarget(0.3).restart();
              d.fx = d.x;
              d.fy = d.y;
            })
            .on("drag", (event, d) => {
              d.fx = event.x;
              d.fy = event.y;
            })
            .on("end", (event, d) => {
              if (!event.active && simulation) simulation.alphaTarget(0);
              d.fx = null;
              d.fy = null;
            })
        );
      const nodesMerge = nodesEnter.merge(nodesSel);

      const labels = labelLayer.selectAll("text").data(
        nodeData.filter((node) => {
          if (!state.showLabels) return false;
          if (node.type === "药物") return true;
          if (!state.selectedNodeId) return false;
          return edges.some((e) =>
            (e.source === state.selectedNodeId && e.target === node.id) ||
            (e.target === state.selectedNodeId && e.source === node.id)
          );
        }),
        (d) => d.id
      );
      labels.exit().remove();
      const labelsEnter = labels.enter()
        .append("text")
        .attr("font-size", 9)
        .attr("fill", "#c8d8f8")
        .attr("pointer-events", "none")
        .text((d) => d.id);
      const labelsMerge = labelsEnter.merge(labels);

      if (!simulation) {
        simulation = d3.forceSimulation()
          .force("link", d3.forceLink().id((d) => d.id).distance((d) => safeText(d.relation).startsWith("结合_") ? 56 : 74))
          .force("charge", d3.forceManyBody().strength(-82))
          .force("center", d3.forceCenter(window.innerWidth * 0.35, window.innerHeight * 0.5))
          .force("collide", d3.forceCollide().radius((d) => d.type === "药物" ? 12 : 8));
      }

      simulation.nodes(nodeData);
      simulation.force("link").links(linkData);
      simulation.alpha(0.8).restart();
      simulation.on("tick", () => {
        linksMerge
          .attr("x1", (d) => d.source.x)
          .attr("y1", (d) => d.source.y)
          .attr("x2", (d) => d.target.x)
          .attr("y2", (d) => d.target.y);

        nodesMerge
          .attr("cx", (d) => d.x)
          .attr("cy", (d) => d.y);

        labelsMerge
          .attr("x", (d) => d.x + 7)
          .attr("y", (d) => d.y - 6);
      });

      applyHighlight();
    }

    function setupControls() {
      searchEl.addEventListener("input", (event) => {
        state.query = safeText(event.target.value);
        updateGraph();
      });

      hopsEl.addEventListener("input", () => {
        state.hops = Number(hopsEl.value) || 2;
        hopsValEl.textContent = String(state.hops);
        updateGraph();
      });

      showLabelsEl.addEventListener("change", () => {
        state.showLabels = !!showLabelsEl.checked;
        updateGraph();
      });

      resetBtn.addEventListener("click", () => {
        state.query = "";
        state.selectedNodeId = null;
        state.hops = 2;
        state.showLabels = true;
        searchEl.value = "";
        hopsEl.value = "2";
        hopsValEl.textContent = "2";
        showLabelsEl.checked = true;
        svg.transition().duration(280).call(zoom.transform, d3.zoomIdentity);
        updateGraph();
      });

      svg.on("click", () => {
        state.selectedNodeId = null;
        updateGraph();
      });

      window.addEventListener("resize", () => {
        if (!simulation) return;
        simulation.force("center", d3.forceCenter(window.innerWidth * 0.35, window.innerHeight * 0.5));
        simulation.alpha(0.2).restart();
      });
    }

    async function boot() {
      try {
        const [graphResp, metaResp] = await Promise.all([
          fetch("./data/graph.json"),
          fetch("./data/meta.json").catch(() => null)
        ]);
        const rawGraph = await graphResp.json();
        const meta = metaResp ? await metaResp.json() : null;
        state.raw = normalizeGraph(rawGraph);

        const typeCounts = new Map();
        state.raw.nodes.forEach((n) => {
          typeCounts.set(n.type, (typeCounts.get(n.type) || 0) + 1);
        });
        const relCounts = new Map();
        state.raw.edges.forEach((e) => {
          relCounts.set(e.relation, (relCounts.get(e.relation) || 0) + 1);
        });

        const types = [...typeCounts.entries()].sort((a, b) => b[1] - a[1]).map(([key, count]) => ({ key, count }));
        const rels = [...relCounts.entries()].sort((a, b) => b[1] - a[1]).map(([key, count]) => ({ key, count }));

        types.forEach((item) => state.activeTypes.add(item.key));
        rels.forEach((item) => state.activeRelations.add(item.key));

        buildChips(typeChipsEl, types, state.activeTypes, nodeColor, updateGraph);
        buildChips(relChipsEl, rels, state.activeRelations, relationColor, updateGraph);
        setupControls();

        if (meta) {
          metaEl.innerHTML =
            `Nodes: ${meta.node_count}<br>` +
            `Edges: ${meta.edge_count}<br>` +
            `Exported: ${safeText(meta.generated_at)}`;
        } else {
          metaEl.innerHTML = `Nodes: ${state.raw.nodes.length}<br>Edges: ${state.raw.edges.length}`;
        }

        updateGraph();
      } catch (error) {
        metaEl.textContent = "加载失败：请确认 data/graph.json 已生成。";
        console.error(error);
      }
    }

    boot();
  </script>
</body>
</html>
